<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <input type="text" id="display" disabled placeholder="0">
            <div class="buttons">
                <button class="btn fn" onclick="appendValue('sin(')">sin</button>
                <button class="btn fn" onclick="appendValue('cos(')">cos</button>
                <button class="btn fn" onclick="appendValue('tan(')">tan</button>
                <button class="btn op" onclick="clearDisplay()">C</button>
                
                <button class="btn fn" onclick="appendValue('sqrt(')">√</button>
                <button class="btn fn" onclick="appendValue('log(')">log</button>
                <button class="btn fn" onclick="appendValue('**')">x^y</button>
                <button class="btn op" onclick="appendValue('/')">/</button>
                
                <button class="btn" onclick="appendValue('7')">7</button>
                <button class="btn" onclick="appendValue('8')">8</button>
                <button class="btn" onclick="appendValue('9')">9</button>
                <button class="btn op" onclick="appendValue('*')">*</button>
                
                <button class="btn" onclick="appendValue('4')">4</button>
                <button class="btn" onclick="appendValue('5')">5</button>
                <button class="btn" onclick="appendValue('6')">6</button>
                <button class="btn op" onclick="appendValue('-')">-</button>
                
                <button class="btn" onclick="appendValue('1')">1</button>
                <button class="btn" onclick="appendValue('2')">2</button>
                <button class="btn" onclick="appendValue('3')">3</button>
                <button class="btn op" onclick="appendValue('+')">+</button>
                
                <button class="btn" onclick="appendValue('0')">0</button>
                <button class="btn" onclick="appendValue('.')">.</button>
                <button class="btn fn" onclick="appendValue(')')">)</button>
                <button class="btn eq" onclick="calculate()">=</button>
            </div>
        </div>

        <div class="graph-section">
            <div class="graph-controls">
                <input type="text" id="graph-eq" placeholder="e.g. sin(x) or x**2">
                <button onclick="plotGraph()">Graph</button>
            </div>
            <div class="canvas-container">
                <canvas id="graphCanvas"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
